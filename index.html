<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101b27" />
  <meta name="description" content="《艾瑟蘭異界物語：新世界》玩家唯讀資料看板：角色、裝備、任務、研究、夢想事業與未完成事項。" />
  <title>艾瑟蘭世界管理中心</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳至主要內容</a>
  <div class="layout">
    <aside class="sidebar" aria-label="主選單">
      <div class="brand">
        <span class="crest" aria-hidden="true">✦</span>
        <div><strong>艾瑟蘭</strong><small>世界管理中心</small></div>
      </div>
      <p class="menu-label">檔案瀏覽</p>
      <nav id="nav" aria-label="看板頁面">
        <button type="button" data-page="overview" class="active"><span aria-hidden="true">◈</span> 總覽</button>
        <button type="button" data-page="characters"><span aria-hidden="true">♙</span> 角色與能力</button>
        <button type="button" data-page="equipment"><span aria-hidden="true">⚔</span> 裝備</button>
        <button type="button" data-page="inventory"><span aria-hidden="true">▣</span> 物品與庫存</button>
        <button type="button" data-page="prices"><span aria-hidden="true">◉</span> 永久商品價格</button>
        <button type="button" data-page="quests"><span aria-hidden="true">☷</span> 公會任務</button>
        <button type="button" data-page="research"><span aria-hidden="true">⚙</span> 夢想工坊</button>
        <button type="button" data-page="logistics"><span aria-hidden="true">✈</span> 夢想物流</button>
        <button type="button" data-page="workforce"><span aria-hidden="true">♧</span> 夢想人力</button>
        <button type="button" data-page="sidelines"><span aria-hidden="true">◇</span> 世界支線</button>
        <button type="button" data-page="npcs"><span aria-hidden="true">♟</span> NPC名冊</button>
        <button type="button" data-page="commitments"><span aria-hidden="true">✓</span> 承諾與待辦</button>
        <button type="button" data-page="timeline"><span aria-hidden="true">◷</span> 歷史紀錄</button>
      </nav>
      <div class="aside-foot">
        <span class="read-only">● 唯讀 · GitHub公開版</span>
        <span id="side-sync">讀取資料中…</span>
        <a href="https://github.com/FisherTsou0429/aetheran-dashboard" target="_blank" rel="noopener noreferrer">在 GitHub 查看資料 ↗</a>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="menu-toggle" type="button" id="menu-toggle" aria-label="開關選單">☰</button>
        <div class="top-title"><span>艾瑟蘭異界物語：新世界</span><small>PLAYER ARCHIVE</small></div>
        <div class="sync-indicator"><span class="pulse" aria-hidden="true"></span><span id="top-status">載入中</span></div>
      </header>
      <main id="main" tabindex="-1">
        <section class="hero-panel">
          <div class="eyebrow">THE WORLD AT A GLANCE / WORLD ARCHIVE</div>
          <h1 id="page-title">艾瑟蘭世界管理中心</h1>
          <p id="page-description">將遊戲進程變成可搜尋、可追蹤的資料。這裡是查閱用的副本，不會改變正式劇情。</p>
          <div class="meta-grid">
            <span id="snapshot-label">遊戲時間：讀取中</span>
            <span id="location-label">目前位置：讀取中</span>
            <span id="save-label">正式來源：讀取中</span>
          </div>
        </section>
        <section class="toolbar" aria-label="搜尋與篩選">
          <label for="search" class="sr-only">搜尋目前分類</label>
          <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜尋名稱、任務ID、物品位置、NPC或研究…" autocomplete="off" /></div>
          <label for="status-filter" class="sr-only">依狀態篩選</label>
          <select id="status-filter"><option value="">所有狀態</option></select>
          <button id="clear-filters" type="button" class="small-btn">清除篩選</button>
        </section>
        <div id="notice" class="notice" role="status" hidden></div>
        <div id="content" aria-live="polite"><p class="loading">正在載入最新資料…</p></div>
        <footer class="footer"><span>《艾瑟蘭異界物語：新世界》玩家專用 · 非遊戲權威存檔</span><span>公開唯讀 · 所有遊戲日期皆為世界內日期</span></footer>
      </main>
    </div>
  </div>
</body>
</html>
